name: update-feed
# The schedule now runs on le11 (deploy/le11): GitHub's cron was hours late and skipped runs.
# This workflow stays as a manual fallback only. Do not re-add `schedule:` while le11 is publishing,
# or two writers will fight over docs/feed.json.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t .
      - run: python -m zdwatch.run
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      - name: Commit feed
        run: |
          git config user.name "zeroday-watch[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add docs state
          git diff --cached --quiet || git commit -m "chore: update feed"
          git push
